name: School Monitor

on:
  schedule:
    # 每天北京时间 8点-22点，每小时运行一次
    - cron: '17 0-14 * * *'
  workflow_dispatch: # 允许你点按钮手动测试
    inputs:
      send_test_email:
        description: '只发送一封测试邮件，不抓取通知'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write # 允许脚本修改 history.txt

concurrency:
  group: school-monitor
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install Libs
        run: python -m pip install requests beautifulsoup4
        
      - name: Run Script
        env:
          # 把邮箱授权码传给脚本
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python main.py
        
      - name: Save History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [[ -n $(git status -s) ]]; then
            git add history.txt
            git commit -m "Update history"
            git push
          fi
